name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME); only the
      # platform and build-tools this project compiles against are installed here.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuaXeSinhTon-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK as a GitHub Release (tag v<versionName>) so it can be
      # downloaded directly on a phone, without logging in or unzipping.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk DuaXeSinhTon.apk
          if gh release view "v$VER" > /dev/null 2>&1; then
            gh release upload "v$VER" DuaXeSinhTon.apk --clobber
          else
            gh release create "v$VER" DuaXeSinhTon.apk --target "$GITHUB_SHA" \
              --title "Đua Xe Sinh Tồn v$VER" --notes "Bản build tự động từ commit $GITHUB_SHA." --latest
          fi
